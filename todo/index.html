<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Todo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --on-accent:#fff; --line:#e5e7eb; --danger:#dc2626; --chip:#e0e7ff; --chip-text:#3730a3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa0a9; --accent:#60a5fa; --on-accent:#0b1220; --line:#2c3038; --danger:#f87171; --chip:#312e81; --chip-text:#c7d2fe; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 16px; font-size:1.5rem; }
  form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  input[type=text], input[type=date], select { padding:10px 12px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  #title { flex:1 1 100%; }
  #tags { flex:1 1 200px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:10px 14px; background:var(--accent); color:var(--on-accent); }
  .filters { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px; }
  .segmented { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .segmented button { background:var(--card); color:var(--text); border-radius:0; padding:8px 14px; }
  .segmented button[aria-pressed=true] { background:var(--accent); color:var(--on-accent); }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  .body { flex:1; min-width:0; }
  .title { word-break:break-word; }
  li.done .title { text-decoration:line-through; color:var(--muted); }
  .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:4px; font-size:.85rem; color:var(--muted); }
  .overdue .due { color:var(--danger); font-weight:600; }
  .chip { background:var(--chip); color:var(--chip-text); border-radius:999px; padding:1px 8px; font-size:.8rem; }
  .repeat { color:var(--accent); font-weight:600; }
  #status.error { color:var(--danger); }
  li button.del { background:transparent; color:var(--danger); padding:4px 8px; }
  input[type=checkbox] { width:18px; height:18px; }
  .empty, #status { color:var(--muted); text-align:center; padding:16px; }
  label.sr { position:absolute; left:-9999px; }
</style>
</head>
<body>
<main>
  <h1>Todo</h1>
  <form id="add">
    <input id="title" type="text" placeholder="What needs doing?" autocomplete="off" required maxlength="200" aria-label="New task">
    <input id="due" type="date" min="1970-01-01" max="9999-12-31" aria-label="Due date">
    <select id="repeat" aria-label="Repeat">
      <option value="">Never repeat</option>
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
    <input id="tags" type="text" placeholder="Tags: work, home" autocomplete="off" maxlength="100" aria-label="Tags">
    <button type="submit">Add</button>
  </form>
  <div class="filters">
    <div class="segmented" role="group" aria-label="Status filter">
      <button type="button" data-status="all" aria-pressed="true">All</button>
      <button type="button" data-status="incomplete" aria-pressed="false">Incomplete</button>
      <button type="button" data-status="completed" aria-pressed="false">Completed</button>
    </div>
    <label class="sr" for="tagFilter">Filter by tag</label>
    <select id="tagFilter"><option value="">All tags</option></select>
  </div>
  <ul id="list"></ul>
  <div id="status" role="status"></div>
</main>
<script>
// Tasks live in the browser's IndexedDB (client-side only): store "tasks", keyPath "id".
// A task is { id, title, done, created, dueDate?: 'YYYY-MM-DD', tags?: string[],
//             repeat?: 'daily'|'weekly'|'monthly', anchorDay?: number, spawned?: boolean, nextId?: number }.
// The optional fields keep tasks saved by earlier versions working. A repeating task needs a dueDate.
// Completing one leaves it as history (spawned: true, nextId) and creates the next occurrence as a new task.
const DB_NAME = 'todo-app', STORE = 'tasks';
let db;
const view = { status: 'all', tag: '' };

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const result = fn(t.objectStore(STORE));
    t.oncomplete = () => resolve(result && result.result);
    t.onerror = t.onabort = () => reject(t.error); // onabort covers e.g. a full browser quota
  });
}

const allTasks = () => tx('readonly', (s) => s.getAll()).then((list) => list.map(normalize));
const addTask = (task) => tx('readwrite', (s) => s.add(task));
const putTask = (task) => tx('readwrite', (s) => s.put(task));
const deleteTask = (id) => tx('readwrite', (s) => s.delete(id));

const list = document.getElementById('list');
const statusEl = document.getElementById('status');
const tagSelect = document.getElementById('tagFilter');

// A save can fail (storage full or blocked); say so instead of failing silently.
function showError() {
  statusEl.className = 'error';
  statusEl.textContent = 'Could not save that change. Browser storage may be full or blocked.';
}
function clearStatus() {
  statusEl.className = '';
  statusEl.textContent = '';
}

function todayString() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// --- Repeat dates (pure functions on 'YYYY-MM-DD' strings) ---
const REPEAT_LABELS = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly' };

function formatDate(y, m, d) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${y}-${pad(m)}-${pad(d)}`;
}

// A due date is a real calendar date written 'YYYY-MM-DD' with a four-digit year from 1970. Keeping the year
// to four digits also keeps the plain string comparisons below correct.
function validDue(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s) || s < '1970-01-01') return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

// The k-th occurrence after `due`. Monthly steps use `anchor`, the day of month the series started on, and
// clamp to the month's length (Jan 31 -> Feb 28/29 -> Mar 31). The anchor travels with each spawned task, so
// a short month never drags later dates earlier.
function stepDue(due, repeat, k, anchor) {
  const [y, m, d] = due.split('-').map(Number);
  if (repeat === 'monthly') {
    const total = (m - 1) + k;
    const yy = y + Math.floor(total / 12);
    const mm = (total % 12) + 1;
    return formatDate(yy, mm, Math.min(anchor || d, new Date(yy, mm, 0).getDate()));
  }
  const dt = new Date(y, m - 1, d + (repeat === 'daily' ? k : 7 * k));
  return formatDate(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
}

// Next due date: counted from the old due date, advanced to the first date after `today`.
function nextDue(due, repeat, today, anchor) {
  let k = 1;
  let next = stepDue(due, repeat, k, anchor);
  while (next <= today) next = stepDue(due, repeat, ++k, anchor);
  return next;
}

// Records are read back from storage that other scripts on the same origin could also write to. Coerce every
// field to the shape the rest of the code expects so one malformed record cannot stop the list rendering.
function normalize(t) {
  return {
    ...t,
    title: typeof t.title === 'string' ? t.title : String(t.title ?? ''),
    done: t.done === true,
    tags: Array.isArray(t.tags) ? t.tags.filter((x) => typeof x === 'string') : [],
    dueDate: validDue(t.dueDate) ? t.dueDate : undefined,
    repeat: Object.hasOwn(REPEAT_LABELS, t.repeat) ? t.repeat : undefined,
    created: Number.isFinite(t.created) ? t.created : 0,
  };
}

// Ticking or un-ticking a task is ONE readwrite transaction that re-reads the stored task first. IndexedDB
// runs such transactions one at a time (also across tabs), so a fast double click or a second tab acts on the
// saved state, never a stale copy, and cannot leave two open copies of a series.
function setDone(task, done) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, 'readwrite');
    const s = t.objectStore(STORE);
    t.oncomplete = resolve;
    t.onerror = t.onabort = () => reject(t.error);
    s.get(task.id).onsuccess = (e) => {
      if (!e.target.result) return; // deleted in the meantime
      const stored = normalize(e.target.result);
      if (done && stored.repeat && stored.dueDate && !stored.spawned) {
        // Completing a repeating task keeps it as history and adds the next occurrence.
        const anchorDay = stored.anchorDay || Number(stored.dueDate.slice(8));
        const add = s.add({
          title: stored.title, done: false, created: Date.now(), tags: stored.tags, repeat: stored.repeat,
          dueDate: nextDue(stored.dueDate, stored.repeat, todayString(), anchorDay), anchorDay,
        });
        // spawned guards against a second copy on re-tick; nextId lets an un-tick undo the spawn.
        add.onsuccess = () => s.put({ ...stored, done: true, spawned: true, nextId: add.result });
      } else if (!done && stored.nextId) {
        // Un-ticking undoes the completion: drop the next occurrence if it is still untouched, so the
        // series never has two open copies. If it was already completed, leave it alone.
        s.get(stored.nextId).onsuccess = (ev) => {
          const next = ev.target.result;
          if (next && next.done !== true) s.delete(stored.nextId);
          const { nextId, ...rest } = stored;
          s.put({ ...rest, done: false, spawned: false });
        };
      } else {
        s.put({ ...stored, done });
      }
    };
  });
}

function parseTags(text) {
  return [...new Set(text.split(',').map((t) => t.trim().toLowerCase()).filter(Boolean))];
}

// Earliest due date first; tasks without a date go last, in creation order.
function byDue(a, b) {
  if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate) || a.created - b.created;
  if (a.dueDate) return -1;
  if (b.dueDate) return 1;
  return a.created - b.created;
}

function refreshTagOptions(tasks) {
  const tags = [...new Set(tasks.flatMap((t) => t.tags || []))].sort();
  if (view.tag && !tags.includes(view.tag)) view.tag = ''; // the last task with that tag is gone
  tagSelect.replaceChildren(new Option('All tags', ''));
  for (const tag of tags) tagSelect.append(new Option(tag, tag));
  tagSelect.value = view.tag;
}

function matches(task) {
  if (view.status === 'completed' && !task.done) return false;
  if (view.status === 'incomplete' && task.done) return false;
  if (view.tag && !(task.tags || []).includes(view.tag)) return false;
  return true;
}

function emptyRow(text) {
  const li = document.createElement('li');
  li.className = 'empty';
  li.textContent = text;
  return li;
}

async function render() {
  // The list is rebuilt on every change, which would drop keyboard focus to <body>. Remember which control
  // had focus (and its row position) so it can be put back afterwards.
  const active = document.activeElement;
  const row = active && list.contains(active) ? active.closest('li[data-id]') : null;
  const keep = row ? {
    id: row.dataset.id,
    index: [...list.children].indexOf(row),
    control: active.type === 'checkbox' ? 'input' : 'button.del',
  } : null;

  let tasks;
  try {
    tasks = await allTasks();
  } catch (e) {
    statusEl.className = 'error';
    statusEl.textContent = 'Could not read your tasks from browser storage.';
    return;
  }
  refreshTagOptions(tasks);
  document.querySelectorAll('[data-status]').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.status === view.status)));

  list.replaceChildren();
  if (!tasks.length) { list.append(emptyRow('No tasks yet.')); return; }
  const shown = tasks.filter(matches).sort(byDue);
  if (!shown.length) { list.append(emptyRow('No matching tasks.')); return; }

  const today = todayString();
  for (const task of shown) {
    const overdue = !task.done && task.dueDate && task.dueDate < today;
    const li = document.createElement('li');
    li.dataset.id = task.id;
    li.className = (task.done ? 'done ' : '') + (overdue ? 'overdue' : '');

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = task.done;
    box.setAttribute('aria-label', task.title); // names the task for screen readers; the state is the checkbox's
    box.onchange = async () => {
      clearStatus();
      try { await setDone(task, box.checked); } catch (e) { showError(); }
      render();
    };

    const body = document.createElement('div');
    body.className = 'body';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = task.title; // textContent keeps user input from being parsed as HTML
    body.append(title);

    if (task.dueDate || task.repeat || (task.tags && task.tags.length)) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      if (task.dueDate) {
        const due = document.createElement('span');
        due.className = 'due';
        due.textContent = (overdue ? 'Overdue · ' : 'Due ') + task.dueDate;
        meta.append(due);
      }
      if (task.repeat) {
        const rep = document.createElement('span');
        rep.className = 'repeat';
        rep.textContent = '↻ ' + REPEAT_LABELS[task.repeat];
        meta.append(rep);
      }
      for (const tag of task.tags || []) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = tag;
        meta.append(chip);
      }
      body.append(meta);
    }

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'Delete';
    del.setAttribute('aria-label', 'Delete ' + task.title);
    del.onclick = async () => {
      clearStatus();
      try { await deleteTask(task.id); } catch (e) { showError(); }
      render();
    };

    li.append(box, body, del);
    list.append(li);
  }

  if (keep) {
    const rows = [...list.querySelectorAll('li[data-id]')];
    const same = rows.find((r) => r.dataset.id === keep.id);
    // If the row is gone (deleted), land on the row that took its place, or the last one.
    const target = same || rows[Math.min(keep.index, rows.length - 1)];
    const control = target && (target.querySelector(keep.control) || target.querySelector('input'));
    if (control) control.focus();
  }
}

document.getElementById('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('title').value.trim();
  if (!title) return;
  const task = { title, done: false, created: Date.now(), tags: parseTags(document.getElementById('tags').value) };
  const due = document.getElementById('due').value;
  const repeat = document.getElementById('repeat').value;
  if ((repeat && !due) || (due && !validDue(due))) {
    statusEl.className = 'error';
    statusEl.textContent = due
      ? 'Enter a due date between 1970 and 9999.'
      : 'Choose a due date for a repeating task.';
    document.getElementById('due').focus();
    return;
  }
  clearStatus();
  if (due) task.dueDate = due;
  if (repeat) task.repeat = repeat;
  try {
    await addTask(task);
    e.target.reset();
  } catch (err) {
    showError();
  }
  render();
});

document.querySelectorAll('[data-status]').forEach((b) =>
  b.addEventListener('click', () => { view.status = b.dataset.status; render(); }));
tagSelect.addEventListener('change', () => { view.tag = tagSelect.value; render(); });

openDb().then((d) => { db = d; render(); })
  .catch(() => { statusEl.textContent = 'Could not open the browser database; tasks will not be saved.'; });
</script>
</body>
</html>
