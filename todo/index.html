<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Todo</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#5f6775; --accent:#2563eb; --on-accent:#fff; --line:#e5e7eb; --danger:#dc2626; --chip:#e0e7ff; --chip-text:#3730a3;
          --p-high-bg:#fee2e2; --p-high:#991b1b; --p-medium-bg:#fef3c7; --p-medium:#92400e; --p-low-bg:#dcfce7; --p-low:#166534; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa0a9; --accent:#60a5fa; --on-accent:#0b1220; --line:#2c3038; --danger:#f87171; --chip:#312e81; --chip-text:#c7d2fe;
            --p-high-bg:#7f1d1d; --p-high:#fecaca; --p-medium-bg:#78350f; --p-medium:#fde68a; --p-low-bg:#14532d; --p-low:#bbf7d0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 16px; font-size:1.5rem; }
  form { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  input[type=text], input[type=date], input[type=search], select { padding:10px 12px; font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  #title, .f-title { flex:1 1 100%; }
  #tags, .f-tags { flex:1 1 200px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:10px 14px; background:var(--accent); color:var(--on-accent); }
  #search { flex:1 1 160px; min-width:0; }
  .filters { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px; }
  .segmented { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .segmented button { background:var(--card); color:var(--text); border-radius:0; padding:8px 14px; }
  .segmented button[aria-pressed=true] { background:var(--accent); color:var(--on-accent); }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li.editing { display:block; }
  .editform { margin:0; }
  .body { flex:1; min-width:0; }
  .title { word-break:break-word; }
  li.done .title { text-decoration:line-through; color:var(--muted); }
  .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:4px; font-size:.85rem; color:var(--muted); }
  .overdue .due { color:var(--danger); font-weight:600; }
  .chip { background:var(--chip); color:var(--chip-text); border-radius:999px; padding:1px 8px; font-size:.8rem; }
  .prio { border-radius:999px; padding:1px 8px; font-size:.8rem; font-weight:600; }
  .prio-high { background:var(--p-high-bg); color:var(--p-high); }
  .prio-medium { background:var(--p-medium-bg); color:var(--p-medium); }
  .prio-low { background:var(--p-low-bg); color:var(--p-low); }
  .repeat { color:var(--accent); font-weight:600; }
  #status.error { color:var(--danger); }
  .actions { display:flex; gap:4px; }
  li button.del { background:transparent; color:var(--danger); padding:4px 8px; }
  li button.edit { background:transparent; color:var(--accent); padding:4px 8px; }
  li button.edit:disabled { opacity:.45; cursor:not-allowed; }
  button.cancel { background:transparent; color:var(--text); border:1px solid var(--line); }
  @media (max-width: 480px) { .actions { flex-direction:column; align-items:stretch; } }
  input[type=checkbox] { width:18px; height:18px; }
  .empty { color:var(--muted); text-align:center; padding:16px; }
  #status { color:var(--muted); padding:0 0 12px; }
  #status:empty { padding:0; }
  .count { color:var(--muted); font-size:.9rem; margin:12px 4px 0; }
  .count:empty { margin:0; } /* no tasks: the live region stays in the page, empty, so its first text is announced */
  .formerror { flex:1 1 100%; color:var(--danger); font-size:.9rem; }
  .formerror:empty { display:none; }
  label.sr { position:absolute; left:-9999px; }
</style>
</head>
<body>
<main>
  <h1>Todo</h1>
  <form id="add">
    <input id="title" type="text" placeholder="What needs doing?" autocomplete="off" required maxlength="200" aria-label="New task">
    <input id="due" type="date" min="1970-01-01" max="9999-12-31" aria-label="Due date">
    <select id="repeat" aria-label="Repeat">
      <option value="">Never repeat</option>
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
    </select>
    <select id="priority" aria-label="Priority">
      <option value="high">High</option>
      <option value="medium" selected>Medium</option>
      <option value="low">Low</option>
    </select>
    <input id="tags" type="text" placeholder="Tags: work, home" autocomplete="off" maxlength="100" aria-label="Tags">
    <button type="submit">Add</button>
  </form>
  <div id="status" role="status"></div>
  <div class="filters">
    <div class="segmented" role="group" aria-label="Status filter">
      <button type="button" data-status="all" aria-pressed="true">All</button>
      <button type="button" data-status="incomplete" aria-pressed="false">Incomplete</button>
      <button type="button" data-status="completed" aria-pressed="false">Completed</button>
    </div>
    <label class="sr" for="tagFilter">Filter by tag</label>
    <select id="tagFilter"><option value="">All tags</option></select>
    <label class="sr" for="priorityFilter">Filter by priority</label>
    <select id="priorityFilter">
      <option value="">All priorities</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <label class="sr" for="search">Search tasks</label>
    <input id="search" type="search" placeholder="Search title or tag" autocomplete="off" maxlength="100">
  </div>
  <ul id="list"></ul>
  <footer id="count" class="count" aria-live="polite"></footer>
</main>
<script>
// Tasks live in the browser's IndexedDB (client-side only): store "tasks", keyPath "id".
// A task is { id, title, done, created, priority?: 'high'|'medium'|'low', dueDate?: 'YYYY-MM-DD', tags?: string[],
//             repeat?: 'daily'|'weekly'|'monthly', anchorDay?: number, spawned?: boolean, nextId?: number,
//             edited?: boolean }.
// The optional fields keep tasks saved by earlier versions working (a missing priority counts as medium). A
// repeating task needs a dueDate. Completing one leaves it as history (spawned: true, nextId) and creates the
// next occurrence as a new task. Editing a task sets edited: true so an un-tick never deletes an edited task.
const DB_NAME = 'todo-app', STORE = 'tasks';
let db;
const view = { status: 'all', tag: '', priority: '', search: '' }; // search is never saved: a reload starts empty
let editing = null;      // { id, draft } while a task is being edited; the draft survives list re-renders
let pendingFocus = null; // { id, ctl, index } asks the next render() to put keyboard focus on a control

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, mode);
    const result = fn(t.objectStore(STORE));
    t.oncomplete = () => resolve(result && result.result);
    t.onerror = t.onabort = () => reject(t.error); // onabort covers e.g. a full browser quota
  });
}

const allTasks = () => tx('readonly', (s) => s.getAll()).then((list) => list.map(normalize));
const addTask = (task) => tx('readwrite', (s) => s.add(task));
const putTask = (task) => tx('readwrite', (s) => s.put(task));
const deleteTask = (id) => tx('readwrite', (s) => s.delete(id));

const list = document.getElementById('list');
const statusEl = document.getElementById('status');
const tagSelect = document.getElementById('tagFilter');
const priorityFilter = document.getElementById('priorityFilter');
const searchBox = document.getElementById('search');
const countEl = document.getElementById('count');

// A save can fail (storage full or blocked); say so instead of failing silently.
function showError() {
  statusEl.className = 'error';
  statusEl.textContent = 'Could not save that change. Browser storage may be full or blocked.';
}
function showProblem(problem) {
  statusEl.className = 'error';
  statusEl.textContent = problem.message;
}
function clearStatus() {
  statusEl.className = '';
  statusEl.textContent = '';
}

function todayString() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// --- Repeat dates (pure functions on 'YYYY-MM-DD' strings) ---
const REPEAT_LABELS = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly' };
const PRIORITY_LABELS = { high: 'High', medium: 'Medium', low: 'Low' };
const PRIORITY_RANK = { high: 0, medium: 1, low: 2 };

function formatDate(y, m, d) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${y}-${pad(m)}-${pad(d)}`;
}

// A due date is a real calendar date written 'YYYY-MM-DD' with a four-digit year from 1970. Keeping the year
// to four digits also keeps the plain string comparisons below correct.
function validDue(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s) || s < '1970-01-01') return false;
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

// One set of rules for the add form and the edit form. Returns null, or { message, field } for the first problem.
function validateFields(title, due, repeat) {
  if (!title) return { message: 'Enter a title.', field: 'title' };
  if (due && !validDue(due)) return { message: 'Enter a due date between 1970 and 9999.', field: 'due' };
  if (repeat && !due) return { message: 'Choose a due date for a repeating task.', field: 'due' };
  return null;
}

// The k-th occurrence after `due`. Monthly steps use `anchor`, the day of month the series started on, and
// clamp to the month's length (Jan 31 -> Feb 28/29 -> Mar 31). The anchor travels with each spawned task, so
// a short month never drags later dates earlier.
function stepDue(due, repeat, k, anchor) {
  const [y, m, d] = due.split('-').map(Number);
  if (repeat === 'monthly') {
    const total = (m - 1) + k;
    const yy = y + Math.floor(total / 12);
    const mm = (total % 12) + 1;
    return formatDate(yy, mm, Math.min(anchor || d, new Date(yy, mm, 0).getDate()));
  }
  const dt = new Date(y, m - 1, d + (repeat === 'daily' ? k : 7 * k));
  return formatDate(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
}

// Next due date: counted from the old due date, advanced to the first date after `today`. Returns '' when the
// next date would fall after the last supported date (9999-12-31): the series simply ends there. Without that
// guard a five-digit year compares below today as a string, and the loop runs for millions of steps.
function nextDue(due, repeat, today, anchor) {
  let k = 1;
  let next = stepDue(due, repeat, k, anchor);
  while (next <= today) {
    if (next.length !== 10) return '';
    next = stepDue(due, repeat, ++k, anchor);
  }
  return next.length === 10 ? next : '';
}

// Text from a stored value that is not a string. String() can throw (for example on {toString: 5}, which storage keeps),
// and one throwing record must not stop the whole list from loading.
function safeText(v) {
  try { return String(v ?? ''); } catch (e) { return ''; }
}

// Records are read back from storage that other scripts on the same origin could also write to. Coerce every
// field to the shape the rest of the code expects so one malformed record cannot stop the list rendering.
function normalize(t) {
  return {
    ...t,
    title: typeof t.title === 'string' ? t.title : safeText(t.title),
    done: t.done === true,
    tags: Array.isArray(t.tags) ? t.tags.filter((x) => typeof x === 'string') : [],
    dueDate: validDue(t.dueDate) ? t.dueDate : undefined,
    // typeof first: Object.hasOwn coerces an array like ['monthly'] to the string 'monthly' and would accept it.
    repeat: typeof t.repeat === 'string' && Object.hasOwn(REPEAT_LABELS, t.repeat) ? t.repeat : undefined,
    priority: typeof t.priority === 'string' && Object.hasOwn(PRIORITY_LABELS, t.priority) ? t.priority : 'medium',
    anchorDay: Number.isInteger(t.anchorDay) && t.anchorDay >= 1 && t.anchorDay <= 31 ? t.anchorDay : undefined,
    nextId: Number.isInteger(t.nextId) ? t.nextId : undefined, // a non-key here would make s.get throw and abort the un-tick
    edited: t.edited === true,
    created: Number.isFinite(t.created) ? t.created : 0,
  };
}

// Ticking or un-ticking a task is ONE readwrite transaction that re-reads the stored task first. IndexedDB
// runs such transactions one at a time (also across tabs), so a fast double click or a second tab acts on the
// saved state, never a stale copy, and cannot leave two open copies of a series.
function setDone(task, done) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(STORE, 'readwrite');
    const s = t.objectStore(STORE);
    t.oncomplete = resolve;
    t.onerror = t.onabort = () => reject(t.error);
    s.get(task.id).onsuccess = (e) => {
      if (!e.target.result) return; // deleted in the meantime
      const stored = normalize(e.target.result);
      if (done && stored.repeat && stored.dueDate && !stored.spawned) {
        // Completing a repeating task keeps it as history and adds the next occurrence.
        const anchorDay = stored.anchorDay || Number(stored.dueDate.slice(8));
        const nextDate = nextDue(stored.dueDate, stored.repeat, todayString(), anchorDay);
        if (!nextDate) { s.put({ ...stored, done: true }); return; } // the series ends at the last supported date
        const add = s.add({
          title: stored.title, done: false, created: Date.now(), tags: stored.tags, repeat: stored.repeat,
          priority: stored.priority, // inherited
          dueDate: nextDate, anchorDay,
        });
        // spawned guards against a second copy on re-tick; nextId lets an un-tick undo the spawn.
        add.onsuccess = () => s.put({ ...stored, done: true, spawned: true, nextId: add.result });
      } else if (!done && stored.nextId) {
        // Un-ticking undoes the completion: drop the next occurrence if it is still untouched, so the
        // series never has two open copies. If it was already completed, or you edited it, leave it alone
        // (an edit is your work and is never deleted for you) and keep this task's spawned/nextId, so
        // ticking it again does not add yet another copy.
        s.get(stored.nextId).onsuccess = (ev) => {
          const next = ev.target.result;
          const keep = next && (next.done === true || next.edited === true);
          if (!keep) {
            if (next) s.delete(stored.nextId);
            const { nextId, ...rest } = stored;
            s.put({ ...rest, done: false, spawned: false });
          } else {
            s.put({ ...stored, done: false }); // keep spawned and nextId: re-ticking must not add another copy
          }
        };
      } else {
        s.put({ ...stored, done });
      }
    };
  });
}

// Saving an edit is also ONE transaction that re-reads the stored task. `patch` holds only the fields the user
// changed in the form (compared with what the form opened with), and only those are applied to the fresh record,
// so a change made elsewhere meanwhile (another tab changing the priority, done, spawned, nextId...) is never
// overwritten with the form's stale copy. Resolves 'saved', 'unchanged', or 'gone' (the task was deleted).
function saveEdit(id, patch) {
  return new Promise((resolve, reject) => {
    let outcome = 'saved';
    const t = db.transaction(STORE, 'readwrite');
    const s = t.objectStore(STORE);
    t.oncomplete = () => resolve(outcome);
    t.onerror = t.onabort = () => reject(t.error);
    s.get(id).onsuccess = (e) => {
      if (!e.target.result) { outcome = 'gone'; return; }
      const stored = normalize(e.target.result);
      const keys = Object.keys(patch).filter((k) => JSON.stringify(patch[k]) !== JSON.stringify(stored[k]));
      if (!keys.length) { outcome = 'unchanged'; return; } // nothing to change: leave the record (and its edited flag) alone
      const next = { ...stored, edited: true };
      for (const k of keys) next[k] = patch[k];
      // A new due date or repeat starts a new series, so a monthly task re-anchors on its new day.
      if (keys.includes('dueDate') || keys.includes('repeat')) delete next.anchorDay;
      s.put(next);
    };
  });
}

function parseTags(text) {
  return [...new Set(text.split(',').map((t) => t.trim().toLowerCase()).filter(Boolean))];
}

// Earliest due date first, then High before Medium before Low, then creation order. Tasks without a date come
// last, ordered by priority and then creation order.
function byDue(a, b) {
  const rank = PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority];
  if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate) || rank || a.created - b.created;
  if (a.dueDate) return -1;
  if (b.dueDate) return 1;
  return rank || a.created - b.created;
}

function refreshTagOptions(tasks) {
  const tags = [...new Set(tasks.flatMap((t) => t.tags || []))].sort();
  if (view.tag && !tags.includes(view.tag)) view.tag = ''; // the last task with that tag is gone
  tagSelect.replaceChildren(new Option('All tags', ''));
  for (const tag of tags) tagSelect.append(new Option(tag, tag));
  tagSelect.value = view.tag;
}

function matches(task) {
  if (view.status === 'completed' && !task.done) return false;
  if (view.status === 'incomplete' && task.done) return false;
  if (view.tag && !(task.tags || []).includes(view.tag)) return false;
  if (view.priority && task.priority !== view.priority) return false;
  if (view.search) {
    // Case-insensitive, literal substring of the title or of any tag. Tags and title come from storage, so guard types.
    const hit = (s) => typeof s === 'string' && s.toLowerCase().includes(view.search);
    if (!hit(task.title) && !(Array.isArray(task.tags) && task.tags.some(hit))) return false;
  }
  return true;
}

function emptyRow(text) {
  const li = document.createElement('li');
  li.className = 'empty';
  li.textContent = text;
  return li;
}

// --- Editing ---
const rowIndex = (id) => [...list.children].findIndex((r) => r.dataset.id === String(id));

function startEdit(task) {
  if (editing) return;
  clearStatus();
  editing = {
    id: task.id, error: '', saving: false,
    // What the form opened with: a save sends only the fields that differ from this.
    orig: { title: task.title, dueDate: task.dueDate, repeat: task.repeat, priority: task.priority, tags: task.tags },
    draft: { title: task.title, due: task.dueDate || '', repeat: task.repeat || '', priority: task.priority, tags: task.tags.join(', ') },
  };
  pendingFocus = { id: task.id, ctl: 'f-title', index: rowIndex(task.id) };
  render();
}

// Every edit action names the task it belongs to and does nothing if that edit is no longer the open one, or if
// a save is already in flight (a save cannot be cancelled half way). This stops a late Enter or Escape, or a
// save finishing after the user moved on, from touching a different edit.
function endEdit(task) {
  if (!editing || editing.id !== task.id) return render(); // stale: just refresh
  pendingFocus = { id: task.id, ctl: 'edit', index: rowIndex(task.id) };
  editing = null;
  return render();
}

function cancelEdit(task) {
  if (!editing || editing.saving || editing.id !== task.id) return;
  clearStatus();
  return endEdit(task);
}

// A problem with an edit is shown inside the edit form, next to the Save button, not in the page's status line
// (which can be far off screen below a long list). The message is kept in `editing` so a re-render restores it.
function showEditError(message) {
  editing.error = message;
  const el = list.querySelector('li.editing .formerror');
  if (el) el.textContent = message;
}

async function commitEdit(task) {
  if (!editing || editing.id !== task.id || editing.saving) return;
  const d = editing.draft;
  const title = d.title.trim();
  const problem = validateFields(title, d.due, d.repeat);
  if (problem) {
    showEditError(problem.message);
    const field = list.querySelector(`li.editing [data-ctl="f-${problem.field}"]`);
    if (field) field.focus();
    return;
  }
  showEditError('');
  const values = { title, dueDate: d.due || undefined, repeat: d.repeat || undefined, priority: d.priority, tags: parseTags(d.tags) };
  const patch = {};
  for (const k of Object.keys(values)) {
    if (JSON.stringify(values[k]) !== JSON.stringify(editing.orig[k])) patch[k] = values[k];
  }
  editing.saving = true;
  let outcome;
  try {
    outcome = await saveEdit(task.id, patch);
  } catch (e) {
    if (editing && editing.id === task.id) {
      editing.saving = false;
      showEditError('Could not save that change. Browser storage may be full or blocked.'); // the form stays open so nothing typed is lost
    }
    return;
  }
  if (outcome === 'gone') showProblem({ message: 'That task no longer exists, so your edit was not saved.' });
  endEdit(task);
}

function buildEditRow(task) {
  const d = editing.draft;
  const li = document.createElement('li');
  li.dataset.id = task.id;
  li.className = 'editing';
  const form = document.createElement('form');
  form.className = 'editform';
  form.setAttribute('aria-label', 'Edit ' + task.title);

  const control = (el, ctl, label, key) => {
    el.dataset.ctl = ctl;
    el.setAttribute('aria-label', label);
    if (key) {
      el.value = d[key];
      const sync = () => { d[key] = el.value; };
      el.addEventListener('input', sync);
      el.addEventListener('change', sync);
    }
    return el;
  };
  const select = (pairs) => {
    const el = document.createElement('select');
    for (const [value, text] of pairs) el.append(new Option(text, value));
    return el;
  };
  const text = (cls, max, placeholder) => {
    const el = document.createElement('input');
    el.type = 'text';
    el.className = cls;
    el.maxLength = max;
    el.placeholder = placeholder; // a visible hint, since the form has no separate labels
    el.autocomplete = 'off';
    return el;
  };

  const titleIn = control(text('f-title', 200, 'Title'), 'f-title', 'Title', 'title');
  const dueIn = document.createElement('input');
  dueIn.type = 'date';
  dueIn.min = '1970-01-01';
  dueIn.max = '9999-12-31';
  control(dueIn, 'f-due', 'Due date', 'due');
  const repeatIn = control(select([['', 'Never repeat'], ...Object.entries(REPEAT_LABELS)]), 'f-repeat', 'Repeat', 'repeat');
  const prioIn = control(select(Object.entries(PRIORITY_LABELS)), 'f-priority', 'Priority', 'priority');
  const tagsIn = control(text('f-tags', 100, 'Tags: work, home'), 'f-tags', 'Tags', 'tags');

  const save = document.createElement('button');
  save.type = 'submit';
  save.className = 'save';
  save.textContent = 'Save';
  control(save, 'save', 'Save changes to ' + task.title);
  const cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.className = 'cancel';
  cancel.textContent = 'Cancel';
  control(cancel, 'cancel', 'Cancel editing ' + task.title);
  cancel.onclick = () => cancelEdit(task);

  form.addEventListener('submit', (e) => { e.preventDefault(); commitEdit(task); });
  form.addEventListener('keydown', (e) => {
    // Escape that an IME or a native picker has already handled must not also discard the draft.
    if (e.key === 'Escape' && !e.isComposing && !e.defaultPrevented) { e.preventDefault(); cancelEdit(task); }
  });
  const error = document.createElement('div');
  error.className = 'formerror';
  error.setAttribute('role', 'alert');
  error.textContent = editing.error;
  form.append(titleIn, dueIn, repeatIn, prioIn, tagsIn, save, cancel, error);
  li.append(form);
  return li;
}

// The footer counts EVERY task, whatever the status, tag and priority filters show, and is empty when there are no
// tasks at all (it stays in the page rather than being hidden, because a live region that is shown for the first
// time is often not announced). A completed occurrence of a recurring task is a task in the list, so it counts as
// done. The dot is hidden from screen readers; the spaces around it are real text, so they hear "3 open 2 done"
// without a stray symbol. The text is only rewritten when it changes, so filtering or opening an edit does not make a
// screen reader announce the same numbers again.
let lastCount = ''; // what the footer currently shows
function updateCount(tasks) {
  const done = tasks.filter((t) => t.done).length;
  const open = tasks.length - done;
  const key = tasks.length === 0 ? '' : `${open} open · ${done} done`;
  if (key === lastCount) return;
  lastCount = key;
  if (!key) { countEl.replaceChildren(); return; }
  const part = (text) => { const s = document.createElement('span'); s.textContent = text; return s; };
  const dot = document.createElement('span');
  dot.setAttribute('aria-hidden', 'true');
  dot.textContent = '·';
  countEl.replaceChildren(part(`${open} open`), ' ', dot, ' ', part(`${done} done`));
}

// When the list has no rows left (for example the edited task no longer matches the filter and nothing else does),
// keyboard focus would fall to <body>; put it on the selected status filter instead.
function focusFallback(keep) {
  if (!keep) return;
  const b = document.querySelector('.segmented [aria-pressed=true]');
  if (b) b.focus();
}

let renderSeq = 0; // each render() takes a number; one that is overtaken while reading storage draws nothing
async function render() {
  const mine = ++renderSeq;
  // The list is rebuilt on every change, which would drop keyboard focus to <body>. Remember which control
  // had focus (and its row position) so it can be put back afterwards. Every focusable row control carries a
  // data-ctl name for this.
  const active = document.activeElement;
  const row = active && list.contains(active) ? active.closest('li[data-id]') : null;
  const keep = pendingFocus || (row && active.dataset.ctl ? {
    id: row.dataset.id,
    index: [...list.children].indexOf(row),
    ctl: active.dataset.ctl,
  } : null);
  pendingFocus = null;

  let tasks;
  try {
    tasks = await allTasks();
  } catch (e) {
    statusEl.className = 'error';
    statusEl.textContent = 'Could not read your tasks from browser storage.';
    countEl.replaceChildren(); lastCount = ''; // do not leave numbers on screen that may no longer be true
    return;
  }
  if (mine !== renderSeq) { if (keep && !pendingFocus) pendingFocus = keep; return; } // a newer render will draw
  if (editing && !tasks.some((t) => String(t.id) === String(editing.id))) {
    editing = null; // the task was deleted elsewhere (another tab)
    showProblem({ message: 'The task you were editing was deleted elsewhere.' });
  }
  // Before the early returns below, so it is right even when no task is shown. Guarded so that a problem in the
  // footer can never stop the list from being drawn.
  try { updateCount(tasks); } catch (e) { countEl.replaceChildren(); lastCount = ''; }
  refreshTagOptions(tasks);
  document.querySelectorAll('[data-status]').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.status === view.status)));

  list.replaceChildren();
  if (!tasks.length) { list.append(emptyRow('No tasks yet.')); focusFallback(keep); return; }
  // The task being edited always stays visible, even if a filter change would hide it, so its form (and the
  // disabled Edit buttons on the other rows) never looks stuck.
  const shown = tasks.filter((t) => matches(t) || (editing && String(editing.id) === String(t.id))).sort(byDue);
  if (!shown.length) { list.append(emptyRow('No matching tasks.')); focusFallback(keep); return; }

  const today = todayString();
  for (const task of shown) {
    if (editing && String(editing.id) === String(task.id)) { list.append(buildEditRow(task)); continue; }
    const overdue = !task.done && task.dueDate && task.dueDate < today;
    const li = document.createElement('li');
    li.dataset.id = task.id;
    li.className = (task.done ? 'done ' : '') + (overdue ? 'overdue' : '');

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.dataset.ctl = 'box';
    box.checked = task.done;
    box.setAttribute('aria-label', task.title); // names the task for screen readers; the state is the checkbox's
    box.onchange = async () => {
      clearStatus();
      try { await setDone(task, box.checked); } catch (e) { showError(); }
      render();
    };

    const body = document.createElement('div');
    body.className = 'body';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = task.title; // textContent keeps user input from being parsed as HTML
    body.append(title);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const prio = document.createElement('span');
    prio.className = 'prio prio-' + task.priority;
    prio.textContent = PRIORITY_LABELS[task.priority];
    meta.append(prio);
    if (task.dueDate) {
      const due = document.createElement('span');
      due.className = 'due';
      due.textContent = (overdue ? 'Overdue · ' : 'Due ') + task.dueDate;
      meta.append(due);
    }
    if (task.repeat) {
      const rep = document.createElement('span');
      rep.className = 'repeat';
      rep.textContent = '↻ ' + REPEAT_LABELS[task.repeat];
      meta.append(rep);
    }
    for (const tag of task.tags || []) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = tag;
      meta.append(chip);
    }
    body.append(meta);

    const edit = document.createElement('button');
    edit.className = 'edit';
    edit.dataset.ctl = 'edit';
    edit.textContent = 'Edit';
    edit.setAttribute('aria-label', 'Edit ' + task.title);
    edit.disabled = !!editing; // one edit at a time, so an unsaved draft is never discarded by starting another
    edit.onclick = () => startEdit(task);

    const del = document.createElement('button');
    del.className = 'del';
    del.dataset.ctl = 'del';
    del.textContent = 'Delete';
    del.setAttribute('aria-label', 'Delete ' + task.title);
    del.onclick = async () => {
      clearStatus();
      try { await deleteTask(task.id); } catch (e) { showError(); }
      render();
    };

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.append(edit, del);
    li.append(box, body, actions);
    list.append(li);
  }

  if (keep) {
    const rows = [...list.querySelectorAll('li[data-id]')];
    const same = rows.find((r) => r.dataset.id === String(keep.id));
    // If the row is gone (deleted, or edited out of the current filter), land on the row that took its place,
    // or the last one.
    const target = same || rows[Math.min(keep.index, rows.length - 1)];
    const control = target && (target.querySelector(`[data-ctl="${keep.ctl}"]`) || target.querySelector('[data-ctl="box"]'));
    if (control) control.focus();
  }
}

document.getElementById('add').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('title').value.trim();
  if (!title) return;
  const due = document.getElementById('due').value;
  const repeat = document.getElementById('repeat').value;
  const problem = validateFields(title, due, repeat);
  if (problem) {
    showProblem(problem);
    document.getElementById(problem.field).focus();
    return;
  }
  const chosen = document.getElementById('priority').value;
  const task = {
    title, done: false, created: Date.now(), tags: parseTags(document.getElementById('tags').value),
    priority: Object.hasOwn(PRIORITY_LABELS, chosen) ? chosen : 'medium',
  };
  clearStatus();
  if (due) task.dueDate = due;
  if (repeat) task.repeat = repeat;
  try {
    await addTask(task);
    e.target.reset();
  } catch (err) {
    showError();
  }
  render();
});

document.querySelectorAll('[data-status]').forEach((b) =>
  b.addEventListener('click', () => { view.status = b.dataset.status; render(); }));
tagSelect.addEventListener('change', () => { view.tag = tagSelect.value; render(); });
priorityFilter.addEventListener('change', () => { view.priority = priorityFilter.value; render(); });
searchBox.addEventListener('input', () => { view.search = searchBox.value.trim().toLowerCase(); render(); });

openDb().then((d) => { db = d; render(); })
  .catch(() => { statusEl.textContent = 'Could not open the browser database; tasks will not be saved.'; });
</script>
</body>
</html>
